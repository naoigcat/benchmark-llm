[tasks.markdownlint]
description = "Lint Markdown in Docker"
run = '''
#!/bin/sh
set -eu
exec docker run --rm \
    --mount "type=bind,src=$MISE_PROJECT_ROOT,dst=/workdir,readonly" \
    --workdir /workdir \
    davidanson/markdownlint-cli2:v0.23.2@sha256:839558fd0d36c46da0e01ea84fd1d20a2822b5a8a60c16dc9708f0bb7c9e903b
'''
